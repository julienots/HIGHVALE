<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0f1115;color:#eef0f5;font:15px/1.45 system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.logo{font-size:56px;text-align:center}h1{text-align:center;margin:0 0 4px}
p{color:#8b92a5;margin:0;text-align:center}label{font-size:13px;color:#8b92a5;margin-top:6px}
input{width:100%;box-sizing:border-box;background:#181b22;color:#eef0f5;border:1px solid #2a2f3a;border-radius:10px;padding:12px;font:inherit}
button{background:#ff5a36;color:#fff;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:700;margin-top:8px}
.err{color:#e5484d;text-align:center;min-height:1.2em}
</style></head><body>
<div class="box">
  <div class="logo">🎬</div>
  <h1>Video Studio</h1>
  <p>Connecte l'app à ton serveur Video Studio.</p>
  <label>Adresse du serveur</label>
  <input id="url" type="url" placeholder="https://mon-studio.exemple.com" autocapitalize="off" autocorrect="off">
  <label>Jeton d'accès</label>
  <input id="token" type="password" placeholder="affiché au démarrage du serveur" autocapitalize="off">
  <button id="go">Se connecter</button>
  <div class="err" id="err"></div>
</div>
<script>
const $=s=>document.querySelector(s);
try{const p=JSON.parse(VideoStudioApp.getSettings());$('#url').value=p.url||'';$('#token').value=p.token||'';}catch(e){}
const q=new URLSearchParams(location.search); if(q.get('error')) $('#err').textContent=q.get('error');
$('#go').onclick=()=>{
  let url=$('#url').value.trim().replace(/\/+$/,''); const token=$('#token').value.trim();
  if(!/^https?:\/\//.test(url)) url='https://'+url;
  if(!token){$('#err').textContent='Le jeton est obligatoire.';return;}
  $('#err').textContent='Connexion…';
  VideoStudioApp.saveSettings(url,token);
};
</script></body></html>
