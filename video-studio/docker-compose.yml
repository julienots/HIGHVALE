# Lance le serveur + un tunnel Cloudflare gratuit (URL https publique affichée dans les logs de "tunnel")
services:
  studio:
    build: ./server
    restart: unless-stopped
    ports: ["8787:8787"]
    volumes: ["./data:/data"]
    environment:
      # Choisis un jeton long et secret (sinon il est généré dans ./data/token.txt)
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - PUBLIC_URL=${PUBLIC_URL:-}
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://studio:8787
    depends_on: [studio]
