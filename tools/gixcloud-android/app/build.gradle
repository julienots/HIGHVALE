plugins { id 'com.android.application' }

android {
    namespace 'com.gixcloud.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gixcloud.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources { excludes += ['META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'about.html', 'plugin.properties', 'META-INF/eclipse.inf', 'META-INF/DEPENDENCIES'] }
    }
}

dependencies {
    implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.3.202401111512-r'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}
