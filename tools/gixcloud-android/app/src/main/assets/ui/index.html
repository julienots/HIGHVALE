<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIXCLOUD</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8b949e;
    --accent: #2f81f7; --ok: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .5px; flex: 1; }
  header h1 span { color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  nav { display: flex; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 49px; z-index: 2; }
  nav button { flex: 1; background: none; border: 0; color: var(--muted); padding: 11px 4px; font: inherit; font-size: 14px; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 16px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 15px; margin: 0 0 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }
  code, pre { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
  button.btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-size: 14px; }
  button.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.btn.danger { background: var(--bad); }
  input, textarea, select { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 9px; font: inherit; }
  textarea { min-height: 220px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .list > div { padding: 11px 2px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .list > div:last-child { border-bottom: 0; }
  .list .grow { flex: 1; min-width: 0; }
  .list .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .tag.open { color: var(--ok); border-color: var(--ok); }
  .tag.merged { color: #a371f7; border-color: #a371f7; }
  .tag.closed { color: var(--bad); border-color: var(--bad); }
  .switch { position: relative; width: 46px; height: 26px; flex: none; }
  .switch input { display: none; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + span { background: var(--ok); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; word-break: break-all; }
  .crumbs a { color: var(--accent); text-decoration: none; }
  .err { color: var(--bad); }
  .hidden { display: none; }
</style>
</head>
<body>
<header><div id="dot" class="dot"></div><h1>GIX<span>CLOUD</span></h1><span id="hdr" class="muted"></span></header>
<nav>
  <button data-tab="ia" class="active">IA / MCP</button>
  <button data-tab="repos">Dépôts</button>
  <button data-tab="apk">APK</button>
  <button data-tab="reglages">Réglages</button>
</nav>
<main id="main"></main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const gx = (name, args = {}) => { const r = JSON.parse(GX.call(name, JSON.stringify(args))); if (!r.ok) throw new Error(r.error); return r.result; };
const status = () => JSON.parse(GX.status());
let tab = 'ia';
let stack = []; // navigation dans les dépôts

function setTab(t) {
  tab = t; stack = [];
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
  refresh();
}
document.querySelectorAll('nav button').forEach((b) => b.onclick = () => setTab(b.dataset.tab));
window.back = () => { if (stack.length > 1) { stack.pop(); render(); return true; } if (tab !== 'ia') { setTab('ia'); return true; } return false; };
const go = (view) => { stack.push(view); render(); };

function header() {
  const s = status();
  $('#dot').classList.toggle('on', s.running);
  $('#hdr').textContent = s.running ? `${s.requests} requêtes` : 'arrêté';
  return s;
}

window.refresh = () => { if (tab === 'repos' && !stack.length) stack = [{ v: 'repos' }]; render(); };

function render() {
  const s = header();
  const m = $('#main');
  try {
    if (tab === 'ia') m.innerHTML = viewIA(s);
    else if (tab === 'repos') m.innerHTML = viewRepo(stack[stack.length - 1] || { v: 'repos' });
    else if (tab === 'apk') m.innerHTML = viewApk();
    else m.innerHTML = viewSettings(s);
  } catch (e) { m.innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
  bind();
}

// ---------- IA / MCP ----------
function viewIA(s) {
  const ip = (s.lan && s.ips[0]) || '127.0.0.1';
  const url = `http://${ip}:${s.port}/mcp`;
  const cc = `claude mcp add --transport http gixcloud ${url} --header "Authorization: Bearer ${s.token}"`;
  const desk = JSON.stringify({ mcpServers: { gixcloud: { command: 'npx', args: ['-y', 'mcp-remote', url, '--allow-http', '--header', `Authorization: Bearer ${s.token}`] } } }, null, 2);
  const generic = `URL : ${url}\nTransport : Streamable HTTP\nEn-tête : Authorization: Bearer ${s.token}`;
  return `
  <div class="card">
    <div class="row"><h2 style="flex:1;margin:0">Serveur MCP</h2>
      <label class="switch"><input type="checkbox" id="srv" ${s.running ? 'checked' : ''}><span></span></label></div>
    <p class="muted">${s.running ? `Actif : ${s.tools} outils disponibles pour les IA.` : 'Arrêté : les IA ne peuvent pas se connecter.'}
    ${s.last_client ? ` Dernier client : ${esc(s.last_client)}.` : ''}</p>
    ${s.error ? `<p class="err">${esc(s.error)}</p>` : ''}
    ${!s.lan ? '<p class="muted">Mode « téléphone seulement » : seules les applis du téléphone (Termux…) peuvent se connecter. Activez le Wi-Fi local dans Réglages pour un ordinateur.</p>' : ''}
    ${s.lan && !s.ips.length ? '<p class="err">Pas de réseau Wi-Fi : connectez le téléphone au même Wi-Fi que l’ordinateur (ou activez le partage de connexion).</p>' : ''}
  </div>
  <div class="card"><h2>Adresse et jeton</h2>
    <pre>${esc(generic)}</pre>
    <div class="row"><button class="btn ghost" data-copy="${esc(url)}">Copier l’URL</button><button class="btn ghost" data-copy="${esc(s.token)}">Copier le jeton</button></div>
    <p class="muted">Le jeton est secret : quiconque l’a peut agir sur vos dépôts. Changez-le dans Réglages si besoin.</p>
  </div>
  <div class="card"><h2>Claude Code (ordinateur, même Wi-Fi)</h2><pre>${esc(cc)}</pre><button class="btn ghost" data-copy="${esc(cc)}">Copier la commande</button></div>
  <div class="card"><h2>Claude Desktop, Cursor, autres IA (fichier de configuration MCP)</h2><pre>${esc(desk)}</pre><button class="btn ghost" data-copy="${esc(desk)}">Copier la configuration</button>
    <p class="muted">Les IA qui acceptent une URL MCP directement : utilisez l’URL et l’en-tête ci-dessus.</p></div>
  <div class="card"><h2>Envoyer un APK depuis l’ordinateur</h2>
    <pre>curl -T monappli.apk -H "Authorization: Bearer ${esc(s.token)}" http://${ip}:${s.port}/upload/monappli.apk</pre>
    <p class="muted">Ou depuis GIXCLOUD sur PC : <code>send_apk</code> avec to = <code>gixcloud://${ip}:${s.port}?token=…</code></p></div>`;
}

// ---------- Dépôts ----------
function viewRepo(st) {
  if (st.v === 'repos') {
    const repos = gx('list_repositories');
    return `<div class="card"><div class="row"><h2 style="flex:1;margin:0">Dépôts (${repos.length})</h2><button class="btn" data-act="newrepo">Nouveau</button></div></div>
      <div class="card list">${repos.map((r) => `<div data-go='${esc(JSON.stringify({ v: 'repo', repo: r.full_name }))}'><div class="grow"><div class="title">${esc(r.full_name)}</div><div class="muted">${esc(r.description || '—')}</div></div><span class="muted">›</span></div>`).join('') || '<p class="muted">Aucun dépôt. Créez-en un ici, ou demandez à une IA connectée.</p>'}</div>`;
  }
  if (st.v === 'newrepo') {
    return `<div class="card"><h2>Nouveau dépôt</h2><label>Nom</label><input id="rn" placeholder="mon-projet"><label>Description</label><input id="rd">
      <p><button class="btn" data-act="createrepo">Créer</button></p></div>`;
  }
  const info = gx('get_repository', { repo: st.repo });
  const crumbs = `<div class="crumbs"><a href="#" data-pop="1">Dépôts</a> / <b>${esc(st.repo)}</b>${st.path ? ' / ' + esc(st.path) : ''} <span class="tag">${esc(st.ref || info.default_branch)}</span></div>`;
  if (st.v === 'repo' || st.v === 'dir') {
    const d = gx('get_file_contents', { repo: st.repo, path: st.path || '', ref: st.ref });
    const head = st.v === 'repo' ? `<div class="card"><div class="muted">${esc(info.description || '')}</div>
      <div class="row" style="margin-top:8px"><span class="tag">${info.branches} branche(s)</span><span class="tag">${info.open_issues} ticket(s)</span><span class="tag">${info.open_pulls} PR</span><span class="tag">${info.releases} version(s)</span></div>
      ${info.last_commit ? `<p class="muted">Dernier commit : ${esc(info.last_commit.message)} — ${esc(info.last_commit.author)}</p>` : ''}
      <div class="row"><button class="btn ghost" data-go='${esc(JSON.stringify({ v: 'issues', repo: st.repo }))}'>Tickets</button><button class="btn ghost" data-go='${esc(JSON.stringify({ v: 'pulls', repo: st.repo }))}'>Pull requests</button><button class="btn ghost" data-go='${esc(JSON.stringify({ v: 'commits', repo: st.repo }))}'>Commits</button></div></div>` : '';
    const entries = (d.entries || []).sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1));
    return crumbs + head + `<div class="card list">${entries.map((e) => `<div data-go='${esc(JSON.stringify({ v: e.type === 'dir' ? 'dir' : 'file', repo: st.repo, path: e.path, ref: st.ref }))}'><span>${e.type === 'dir' ? '📁' : '📄'}</span><div class="grow title">${esc(e.name)}</div><span class="muted">${e.size != null ? e.size + ' o' : ''}</span></div>`).join('') || '<p class="muted">Dépôt vide.</p>'}</div>`;
  }
  if (st.v === 'file') {
    const f = gx('get_file_contents', { repo: st.repo, path: st.path, ref: st.ref });
    if (f.encoding === 'base64') return crumbs + `<div class="card muted">Fichier binaire (${f.size} octets).</div>`;
    return crumbs + `<div class="card"><textarea id="fc">${esc(f.content)}</textarea><input type="hidden" id="fsha" value="${esc(f.sha)}">
      <label>Message de commit</label><input id="fm" placeholder="Mise à jour de ${esc(st.path)}"><p><button class="btn" data-act="savefile">Enregistrer (commit)</button></p></div>`;
  }
  if (st.v === 'commits') {
    const cs = gx('list_commits', { repo: st.repo, limit: 50 });
    return crumbs + `<div class="card list">${cs.map((c) => `<div><div class="grow"><div class="title">${esc(c.message)}</div><div class="muted">${esc(c.short)} · ${esc(c.author)} · ${esc(c.date.slice(0, 16).replace('T', ' '))}</div></div></div>`).join('') || '<p class="muted">Aucun commit.</p>'}</div>`;
  }
  if (st.v === 'issues' || st.v === 'pulls') {
    const items = gx(st.v === 'issues' ? 'list_issues' : 'list_pull_requests', { repo: st.repo, state: 'all' });
    return crumbs + `<div class="card list">${items.map((i) => `<div data-go='${esc(JSON.stringify({ v: st.v === 'issues' ? 'issue' : 'pull', repo: st.repo, number: i.number }))}'><span class="tag ${i.state}">${i.state}</span><div class="grow"><div class="title">#${i.number} ${esc(i.title)}</div><div class="muted">${esc(i.author)} · ${i.comments} commentaire(s)</div></div></div>`).join('') || '<p class="muted">Rien pour l’instant.</p>'}</div>`;
  }
  if (st.v === 'issue' || st.v === 'pull') {
    const it = gx(st.v === 'issue' ? 'get_issue' : 'get_pull_request', { repo: st.repo, number: st.number, include_diff: false });
    const extra = st.v === 'pull' ? `<p class="muted">${esc(it.head)} → ${esc(it.base)} ${it.state === 'open' ? (it.mergeable ? '· fusion possible' : '· ' + esc(it.state === 'open' && it.conflicts ? 'conflits : ' + it.conflicts.join(', ') : '')) : ''}</p>
      ${it.state === 'open' && it.mergeable ? '<button class="btn" data-act="merge">Fusionner</button>' : ''}` : '';
    return crumbs + `<div class="card"><div class="row"><span class="tag ${it.state}">${it.state}</span><h2 style="margin:0">#${it.number} ${esc(it.title)}</h2></div>
      <pre>${esc(it.body || '(pas de description)')}</pre>${extra}</div>
      <div class="card list">${(it.comments || []).map((c) => `<div><div class="grow"><div class="muted">${esc(c.author)} · ${esc(c.created_at)}</div><div>${esc(c.body)}</div></div></div>`).join('') || '<p class="muted">Aucun commentaire.</p>'}</div>
      <div class="card"><textarea id="cm" style="min-height:80px" placeholder="Commentaire"></textarea><p><button class="btn" data-act="comment">Commenter</button></p></div>`;
  }
  return '';
}

// ---------- APK ----------
function viewApk() {
  const apks = gx('list_apks');
  return `<div class="card"><div class="row"><h2 style="flex:1;margin:0">APK sur le téléphone (${apks.length})</h2><button class="btn" data-act="pick">Importer</button></div>
    <p class="muted">Les IA envoient des APK avec <code>upload_apk</code> ou HTTP <code>PUT /upload</code>. Vous pouvez aussi partager un APK vers GIXCLOUD depuis n’importe quelle appli.</p></div>
    <div class="card list">${apks.map((a) => `<div><div class="grow"><div class="title">${esc(a.name)}</div><div class="muted">${(a.size / 1048576).toFixed(2)} Mo · ${esc(a.modified.slice(0, 16).replace('T', ' '))}</div></div>
      <button class="btn" data-install="${esc(a.name)}">Installer</button><button class="btn ghost" data-dl="${esc(a.name)}">⬇</button><button class="btn ghost" data-del="${esc(a.name)}">✕</button></div>`).join('') || '<p class="muted">Aucun APK.</p>'}</div>`;
}

// ---------- Réglages ----------
function viewSettings(s) {
  return `<div class="card"><h2>Connexion</h2>
    <div class="row"><div style="flex:1">Accessible depuis le Wi-Fi local<div class="muted">Désactivé : seulement depuis le téléphone (127.0.0.1)</div></div><label class="switch"><input type="checkbox" id="lan" ${s.lan ? 'checked' : ''}><span></span></label></div>
    <label>Port</label><input id="port" type="number" value="${s.port}">
    <label>Propriétaire par défaut des dépôts</label><input id="owner" value="${esc(s.owner)}">
    <label>Auteur des commits</label><input id="author" value="${esc(s.author)}">
    <p class="row"><button class="btn" data-act="save">Enregistrer</button><button class="btn danger" data-act="token">Nouveau jeton</button></p>
    <p class="muted">GIXCLOUD ${esc(s.version)} · aucune donnée ne quitte le téléphone : pas de compte, pas de cloud, pas de serveur externe.</p></div>`;
}

// ---------- Actions ----------
function bind() {
  document.querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => GX.copy(b.dataset.copy));
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => go(JSON.parse(b.dataset.go)));
  document.querySelectorAll('[data-pop]').forEach((b) => b.onclick = (e) => { e.preventDefault(); stack = [{ v: 'repos' }]; render(); });
  document.querySelectorAll('[data-install]').forEach((b) => b.onclick = () => act(() => alert(gx('install_apk', { apk: b.dataset.install }).result)));
  document.querySelectorAll('[data-dl]').forEach((b) => b.onclick = () => act(() => alert('Copié dans ' + gx('save_apk_to_downloads', { apk: b.dataset.dl }).saved)));
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => confirm('Supprimer ' + b.dataset.del + ' ?') && act(() => gx('delete_apk', { apk: b.dataset.del })));
  const srv = $('#srv'); if (srv) srv.onchange = () => { GX.setServer(srv.checked); setTimeout(render, 700); };
  document.querySelectorAll('[data-act]').forEach((b) => b.onclick = () => act(() => actions[b.dataset.act]()));
}
const cur = () => stack[stack.length - 1];
const actions = {
  newrepo: () => go({ v: 'newrepo' }),
  createrepo: () => { const r = gx('create_repository', { name: $('#rn').value.trim(), description: $('#rd').value }); stack = [{ v: 'repos' }, { v: 'repo', repo: r.full_name }]; },
  savefile: () => { const c = cur(); gx('create_or_update_file', { repo: c.repo, path: c.path, content: $('#fc').value, sha: $('#fsha').value, branch: c.ref, message: $('#fm').value || undefined }); alert('Commit enregistré'); },
  comment: () => { const c = cur(); gx('add_issue_comment', { repo: c.repo, number: c.number, body: $('#cm').value }); },
  merge: () => { const c = cur(); const r = gx('merge_pull_request', { repo: c.repo, number: c.number }); alert('Fusionné : ' + r.commit.slice(0, 7)); },
  pick: () => GX.pickApk(),
  save: () => { GX.settings(JSON.stringify({ lan: $('#lan').checked, port: parseInt($('#port').value, 10) || 8765, owner: $('#owner').value.trim() || 'moi', author: $('#author').value.trim() || 'GIXCLOUD' })); setTimeout(render, 900); },
  token: () => { if (confirm('Les IA déjà connectées devront utiliser le nouveau jeton. Continuer ?')) { GX.settings(JSON.stringify({ new_token: true })); setTimeout(render, 900); } },
};
function act(fn) { try { fn(); } catch (e) { alert(e.message); } render(); }

setInterval(header, 3000);
setTab('ia');
</script>
</body>
</html>
